<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#15120a">
  <title>BB Scores</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 600;
      background-color: #fdf8f0;
      background-image: radial-gradient(circle, #c4bdb0 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      background-attachment: fixed;
      color: #15120a;
      line-height: 1.5;
    }

    #shapes-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ms {
      position: absolute;
      opacity: 0;
      transform: scale(0.4) rotate(var(--r, 0deg));
      transition: opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .ms.visible {
      opacity: 1;
      transform: scale(1) rotate(var(--r, 0deg));
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #15120a;
      border-bottom: 6px solid #1a6ef5;
      padding: 14px 20px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
    }

    .logo {
      font-family: 'Nunito', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #1a6ef5;
    }

    .logo span {
      color: #ffffff;
      font-weight: 400;
    }

    .refresh-btn {
      background: #1a6ef5;
      color: white;
      border: none;
      border-radius: 11px;
      padding: 8px 14px;
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .refresh-btn:hover {
      transform: scale(1.05);
    }
    .refresh-btn:active {
      transform: scale(0.95);
    }

    .main {
      position: relative;
      z-index: 10;
      padding: 20px;
      padding-bottom: 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }

    .section-title {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-toggle {
      font-size: 16px;
      color: #5a5040;
      transition: transform 0.2s;
    }
    .section-toggle.collapsed {
      transform: rotate(-90deg);
    }

    .section-content {
      max-height: 10000px;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .section-content.collapsed {
      max-height: 0;
    }

    .card-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .card-shadow {
      position: absolute;
      top: 5px;
      left: 5px;
      right: -5px;
      bottom: -5px;
      background: #b8ae9e;
      border-radius: 16px;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: #fffef9;
      border: 2.5px solid #ddd5c5;
      border-left-width: 7px;
      border-left-color: #1a6ef5;
      border-radius: 16px;
      padding: 12px 14px;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .card:hover {
      transform: translate(-2px, -2px);
    }

    .card.live {
      border-left-color: #e8234a;
      background: #fff5f7;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card-matchup {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
    }

    .card-team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .team-name {
      font-weight: 700;
      font-size: 13px;
    }

    .team-score {
      font-weight: 900;
      font-size: 16px;
      color: #1a6ef5;
    }

    .card.live .team-score {
      color: #e8234a;
    }

    .card-status {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #5a5040;
    }

    .card.live .card-status {
      color: #e8234a;
      font-weight: 900;
    }

    .card-inning {
      font-size: 10px;
      color: #a09080;
      margin-top: 6px;
    }

    .favorite-btn {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.15s;
    }
    .favorite-btn:hover {
      transform: scale(1.2);
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #a09080;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .main {
        padding: 16px;
      }

      .logo {
        font-size: 24px;
      }

      .card {
        padding: 10px 12px;
      }

      .team-name {
        font-size: 12px;
      }

      .team-score {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="shapes-layer" aria-hidden="true"></div>

  <div class="header">
    <div class="header-content">
      <div class="logo">BB <span>Scores</span></div>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <div class="main">
    <div class="section">
      <div class="section-header" data-section="favorites">
        <div class="section-title">
          <span>⭐ Favorites</span>
        </div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="favorites-content">
        <div class="empty-state">No favorites yet. Star a team to add it here.</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header" data-section="live">
        <div class="section-title">
          <span>🔴 Live Now</span>
        </div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="live-content">
        <div class="empty-state">No live games right now.</div>
      </div>
    </div>

    <div class="section" data-league="MLB">
      <div class="section-header" data-section="mlb">
        <div class="section-title"><span>MLB</span></div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="mlb-content"></div>
    </div>

    <div class="section" data-league="NPB">
      <div class="section-header" data-section="npb">
        <div class="section-title"><span>NPB</span></div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="npb-content"></div>
    </div>

    <div class="section" data-league="KBO">
      <div class="section-header" data-section="kbo">
        <div class="section-title"><span>KBO</span></div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="kbo-content"></div>
    </div>

    <div class="section" data-league="LMB">
      <div class="section-header" data-section="lmb">
        <div class="section-title"><span>LMB</span></div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="lmb-content"></div>
    </div>

    <div class="section" data-league="AAA">
      <div class="section-header" data-section="aaa">
        <div class="section-title"><span>AAA</span></div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="aaa-content"></div>
    </div>
  </div>

  <script>
    const API_CACHE = {};
    const CACHE_TTL = 45000;
    let allGames = {};
    let favorites = new Set(JSON.parse(localStorage.getItem('baseball_favorites') || '[]'));

    // Sample data
    const sampleGames = {
      mlb: [
        { league: 'MLB', id: 'mlb1', homeTeam: 'Baltimore Orioles', awayTeam: 'New York Yankees', homeScore: 4, awayScore: 2, status: 'STATUS_IN_PROGRESS', inning: 6 },
        { league: 'MLB', id: 'mlb2', homeTeam: 'Boston Red Sox', awayTeam: 'Toronto Blue Jays', homeScore: 3, awayScore: 3, status: 'STATUS_IN_PROGRESS', inning: 7 },
        { league: 'MLB', id: 'mlb3', homeTeam: 'Los Angeles Dodgers', awayTeam: 'San Francisco Giants', homeScore: 5, awayScore: 1, status: 'STATUS_FINAL', inning: 9 }
      ],
      npb: [
        { league: 'NPB', id: 'npb1', homeTeam: 'Yomiuri Giants', awayTeam: 'Hanshin Tigers', homeScore: 3, awayScore: 2, status: 'STATUS_FINAL', inning: 9 },
        { league: 'NPB', id: 'npb2', homeTeam: 'Yakult Swallows', awayTeam: 'Yokohama BayStars', homeScore: 5, awayScore: 4, status: 'STATUS_IN_PROGRESS', inning: 7 }
      ],
      kbo: [
        { league: 'KBO', id: 'kbo1', homeTeam: 'LG Twins', awayTeam: 'Samsung Lions', homeScore: 4, awayScore: 3, status: 'STATUS_IN_PROGRESS', inning: 5 },
        { league: 'KBO', id: 'kbo2', homeTeam: 'Hanwha Eagles', awayTeam: 'Doosan Bears', homeScore: 2, awayScore: 2, status: 'STATUS_SCHEDULED', inning: 0 }
      ],
      lmb: [
        { league: 'LMB', id: 'lmb1', homeTeam: 'Diablos Rojos', awayTeam: 'Sultanes de Monterrey', homeScore: 6, awayScore: 4, status: 'STATUS_FINAL', inning: 9 }
      ],
      aaa: [
        { league: 'AAA', id: 'aaa1', homeTeam: 'Columbus Clippers', awayTeam: 'Toledo Mud Hens', homeScore: 5, awayScore: 3, status: 'STATUS_IN_PROGRESS', inning: 6 },
        { league: 'AAA', id: 'aaa2', homeTeam: 'Omaha Storm Chasers', awayTeam: 'Las Vegas Aviators', homeScore: 2, awayScore: 1, status: 'STATUS_FINAL', inning: 9 }
      ]
    };

    // Fetch functions
    async function fetchMLB() {
      const now = Date.now();
      if (API_CACHE['mlb'] && now - API_CACHE['mlb'].time < CACHE_TTL) return API_CACHE['mlb'].data;
      const data = sampleGames.mlb;
      API_CACHE['mlb'] = { time: now, data };
      return data;
    }

    async function fetchNPB() {
      const now = Date.now();
      if (API_CACHE['npb'] && now - API_CACHE['npb'].time < CACHE_TTL) return API_CACHE['npb'].data;
      const data = sampleGames.npb;
      API_CACHE['npb'] = { time: now, data };
      return data;
    }

    async function fetchKBO() {
      const now = Date.now();
      if (API_CACHE['kbo'] && now - API_CACHE['kbo'].time < CACHE_TTL) return API_CACHE['kbo'].data;
      const data = sampleGames.kbo;
      API_CACHE['kbo'] = { time: now, data };
      return data;
    }

    async function fetchLMB() {
      const now = Date.now();
      if (API_CACHE['lmb'] && now - API_CACHE['lmb'].time < CACHE_TTL) return API_CACHE['lmb'].data;
      const data = sampleGames.lmb;
      API_CACHE['lmb'] = { time: now, data };
      return data;
    }

    async function fetchAAA() {
      const now = Date.now();
      if (API_CACHE['aaa'] && now - API_CACHE['aaa'].time < CACHE_TTL) return API_CACHE['aaa'].data;
      const data = sampleGames.aaa;
      API_CACHE['aaa'] = { time: now, data };
      return data;
    }

    // Render card
    function renderCard(game) {
      const isLive = game.status === 'STATUS_IN_PROGRESS';
      const homeKey = `${game.league}-${game.homeTeam}`;
      const awayKey = `${game.league}-${game.awayTeam}`;
      const isFav = favorites.has(homeKey) || favorites.has(awayKey);
      
      const statusText = isLive ? `Live - Inning ${game.inning}` : game.status === 'STATUS_FINAL' ? 'Final' : 'Upcoming';

      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';

      const shadow = document.createElement('div');
      shadow.className = 'card-shadow';
      wrap.appendChild(shadow);

      const card = document.createElement('div');
      card.className = `card ${isLive ? 'live' : ''}`;
      card.innerHTML = `
        <div class="card-header">
          <div class="card-matchup">
            <div class="card-team">
              <span class="team-name">${game.awayTeam}</span>
              <span class="team-score">${game.awayScore}</span>
            </div>
            <div class="card-team">
              <span class="team-name">${game.homeTeam}</span>
              <span class="team-score">${game.homeScore}</span>
            </div>
          </div>
          <button class="favorite-btn" data-home="${homeKey}" data-away="${awayKey}">${isFav ? '⭐' : '☆'}</button>
        </div>
        <div class="card-status">${statusText}</div>
      `;

      card.querySelector('.favorite-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        const hk = e.target.dataset.home;
        const ak = e.target.dataset.away;
        if (favorites.has(hk)) {
          favorites.delete(hk);
        } else if (favorites.has(ak)) {
          favorites.delete(ak);
        } else {
          favorites.add(hk);
        }
        localStorage.setItem('baseball_favorites', JSON.stringify(Array.from(favorites)));
        renderAll();
      });

      wrap.appendChild(card);
      return wrap;
    }

    // Render sections
    function updateFavorites() {
      const container = document.getElementById('favorites-content');
      container.innerHTML = '';
      const allLive = Object.values(allGames).flat().filter(g => g.status !== 'STATUS_SCHEDULED');
      const favGames = allLive.filter(g => favorites.has(`${g.league}-${g.homeTeam}`) || favorites.has(`${g.league}-${g.awayTeam}`));
      
      if (favGames.length === 0) {
        container.innerHTML = '<div class="empty-state">No favorites yet. Star a team to add it here.</div>';
        return;
      }
      favGames.forEach(g => container.appendChild(renderCard(g)));
    }

    function updateLive() {
      const container = document.getElementById('live-content');
      container.innerHTML = '';
      const liveGames = Object.values(allGames).flat().filter(g => g.status === 'STATUS_IN_PROGRESS');
      
      if (liveGames.length === 0) {
        container.innerHTML = '<div class="empty-state">No live games right now. Check back soon!</div>';
        return;
      }
      liveGames.forEach(g => container.appendChild(renderCard(g)));
    }

    function renderLeague(league, code) {
      const container = document.getElementById(`${code}-content`);
      const games = allGames[code] || [];
      container.innerHTML = '';
      
      if (games.length === 0) {
        container.innerHTML = '<div class="empty-state">No games scheduled.</div>';
        return;
      }
      
      const sorted = [...games].sort((a, b) => (a.status === 'STATUS_IN_PROGRESS' ? -1 : 1));
      sorted.forEach(g => container.appendChild(renderCard(g)));
    }

    async function renderAll() {
      allGames.mlb = await fetchMLB();
      allGames.npb = await fetchNPB();
      allGames.kbo = await fetchKBO();
      allGames.lmb = await fetchLMB();
      allGames.aaa = await fetchAAA();
      
      updateFavorites();
      updateLive();
      renderLeague('MLB', 'mlb');
      renderLeague('NPB', 'npb');
      renderLeague('KBO', 'kbo');
      renderLeague('LMB', 'lmb');
      renderLeague('AAA', 'aaa');
    }

    // Init shapes
    function initShapes() {
      const layer = document.getElementById('shapes-layer');
      const shapes = [
        { cx: 20, cy: 100, r: 16, fill: '#1a6ef5' },
        { cx: 60, cy: 400, r: 12, fill: '#e8234a' },
        { cx: 40, cy: 700, r: 10, fill: '#00a86b' },
        { cx: 70, cy: 200, r: 8, fill: '#f5620a' },
        { cx: 30, cy: 900, r: 14, fill: '#8b1af5' }
      ];
      
      shapes.forEach((s, i) => {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'ms');
        svg.setAttribute('style', `--r: ${Math.random() * 35}deg; top: ${s.cy}px; left: ${s.cx}px;`);
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('width', '60');
        svg.setAttribute('height', '60');
        
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '50');
        circle.setAttribute('cy', '50');
        circle.setAttribute('r', s.r);
        circle.setAttribute('fill', s.fill);
        svg.appendChild(circle);
        layer.appendChild(svg);
      });

      const shapeElements = document.querySelectorAll('.ms');
      const shapeData = Array.from(shapeElements).map((el, i) => ({
        el,
        threshold: Math.max(0, (parseFloat(el.style.top) || 0) - window.innerHeight * 0.75),
        delay: (i % 4) * 80,
        triggered: false
      }));

      function checkShapes() {
        const scrollY = window.scrollY;
        shapeData.forEach((item, i) => {
          if (!item.triggered && scrollY >= item.threshold) {
            shapeData[i].triggered = true;
            setTimeout(() => item.el.classList.add('visible'), item.delay);
          }
        });
      }
      checkShapes();
      window.addEventListener('scroll', checkShapes, { passive: true });
    }

    // Toggle sections
    document.querySelectorAll('.section-header').forEach(header => {
      header.addEventListener('click', () => {
        const content = header.nextElementSibling;
        const toggle = header.querySelector('.section-toggle');
        content.classList.toggle('collapsed');
        toggle.classList.toggle('collapsed');
      });
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      Object.keys(API_CACHE).forEach(k => delete API_CACHE[k]);
      renderAll();
    });

    // Init
    initShapes();
    renderAll();
  </script>
</body>
</html>
