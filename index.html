<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#15120a">
  <title>BB Scores</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 600;
      background-color: #fdf8f0;
      background-image: radial-gradient(circle, #c4bdb0 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      background-attachment: fixed;
      color: #15120a;
      line-height: 1.5;
    }

    #shapes-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ms {
      position: absolute;
      opacity: 0;
      transform: scale(0.4) rotate(var(--r, 0deg));
      transition: opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .ms.visible {
      opacity: 1;
      transform: scale(1) rotate(var(--r, 0deg));
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #15120a;
      border-bottom: 6px solid #1a6ef5;
      padding: 14px 20px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
    }

    .logo {
      font-family: 'Nunito', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #1a6ef5;
    }

    .logo span {
      color: #ffffff;
      font-weight: 400;
    }

    .header-controls {
      display: flex;
      gap: 10px;
    }

    .hamburger-btn, .refresh-btn {
      background: #1a6ef5;
      color: white;
      border: none;
      border-radius: 11px;
      padding: 8px 14px;
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hamburger-btn:hover, .refresh-btn:hover {
      transform: scale(1.05);
    }
    .hamburger-btn:active, .refresh-btn:active {
      transform: scale(0.95);
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100vh;
      background: #fffef9;
      border-right: 3px solid #ddd5c5;
      z-index: 200;
      transition: left 0.3s ease;
      overflow-y: auto;
      padding-top: 20px;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 150;
      display: none;
    }

    .sidebar-overlay.open {
      display: block;
    }

    .sidebar-section {
      padding: 20px;
      border-bottom: 2px solid #ddd5c5;
    }

    .sidebar-title {
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      color: #1a6ef5;
    }

    .team-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .team-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: #fdf8f0;
      border: 2px solid #ddd5c5;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .team-item:hover {
      background: #f5f3f0;
    }
    .team-item.selected {
      background: #dce9ff;
      border-color: #1a6ef5;
    }

    .team-checkbox {
      width: 16px;
      height: 16px;
      accent-color: #1a6ef5;
      cursor: pointer;
    }

    .main {
      position: relative;
      z-index: 10;
      padding: 20px;
      padding-bottom: 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }

    .section-title {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-toggle {
      font-size: 16px;
      color: #5a5040;
      transition: transform 0.2s;
    }
    .section-toggle.collapsed {
      transform: rotate(-90deg);
    }

    .section-content {
      max-height: 10000px;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .section-content.collapsed {
      max-height: 0;
    }

    .card-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .card-shadow {
      position: absolute;
      top: 5px;
      left: 5px;
      right: -5px;
      bottom: -5px;
      background: #b8ae9e;
      border-radius: 16px;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: #fffef9;
      border: 2.5px solid #ddd5c5;
      border-left-width: 7px;
      border-left-color: #1a6ef5;
      border-radius: 16px;
      padding: 12px 14px;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card:hover {
      transform: translate(-2px, -2px);
    }

    .card.live {
      border-left-color: #e8234a;
      background: #fff5f7;
    }

    .card-matchup {
      font-size: 14px;
      font-weight: 700;
    }

    .card-team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .team-name {
      font-weight: 700;
      font-size: 13px;
    }

    .team-score {
      font-weight: 900;
      font-size: 16px;
      color: #1a6ef5;
    }

    .card.live .team-score {
      color: #e8234a;
    }

    .card-status {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #5a5040;
    }

    .card.live .card-status {
      color: #e8234a;
      font-weight: 900;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #a09080;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #a09080;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .main { padding: 16px; }
      .logo { font-size: 24px; }
      .sidebar { width: 280px; left: -280px; }
    }
  </style>
</head>
<body>
  <div id="shapes-layer" aria-hidden="true"></div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section" id="mlbTeams">
      <div class="sidebar-title">MLB</div>
      <div class="team-list" id="mlbTeamList"></div>
    </div>
    <div class="sidebar-section" id="npbTeams">
      <div class="sidebar-title">NPB</div>
      <div class="team-list" id="npbTeamList"></div>
    </div>
    <div class="sidebar-section" id="kboTeams">
      <div class="sidebar-title">KBO</div>
      <div class="team-list" id="kboTeamList"></div>
    </div>
    <div class="sidebar-section" id="lmbTeams">
      <div class="sidebar-title">LMB</div>
      <div class="team-list" id="lmbTeamList"></div>
    </div>
    <div class="sidebar-section" id="aaaTeams">
      <div class="sidebar-title">AAA</div>
      <div class="team-list" id="aaaTeamList"></div>
    </div>
  </div>

  <div class="header">
    <div class="header-content">
      <div class="logo">BB <span>Scores</span></div>
      <div class="header-controls">
        <button class="hamburger-btn" id="hamburgerBtn">☰</button>
        <button class="refresh-btn" id="refreshBtn">↻</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="section">
      <div class="section-header" data-section="live">
        <div class="section-title">🔴 Live Now</div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="live-content"></div>
    </div>

    <div class="section" data-league="MLB">
      <div class="section-header" data-section="mlb">
        <div class="section-title">MLB</div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="mlb-content"></div>
    </div>

    <div class="section" data-league="NPB">
      <div class="section-header" data-section="npb">
        <div class="section-title">NPB</div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="npb-content"></div>
    </div>

    <div class="section" data-league="KBO">
      <div class="section-header" data-section="kbo">
        <div class="section-title">KBO</div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="kbo-content"></div>
    </div>

    <div class="section" data-league="LMB">
      <div class="section-header" data-section="lmb">
        <div class="section-title">LMB</div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="lmb-content"></div>
    </div>

    <div class="section" data-league="AAA">
      <div class="section-header" data-section="aaa">
        <div class="section-title">AAA</div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="aaa-content"></div>
    </div>
  </div>

  <script>
    const API_CACHE = {};
    const CACHE_TTL = 45000;
    let allGames = {};
    let favorites = new Set(JSON.parse(localStorage.getItem('baseball_favorites') || '[]'));

    const leagueTeams = {
      MLB: [
        // AL East
        'Baltimore Orioles', 'Boston Red Sox', 'New York Yankees', 'Tampa Bay Rays', 'Toronto Blue Jays',
        // AL Central
        'Chicago White Sox', 'Cleveland Guardians', 'Detroit Tigers', 'Kansas City Royals', 'Minnesota Twins',
        // AL West
        'Houston Astros', 'Los Angeles Angels', 'Oakland Athletics', 'Seattle Mariners', 'Texas Rangers',
        // NL East
        'Atlanta Braves', 'Miami Marlins', 'New York Mets', 'Philadelphia Phillies', 'Washington Nationals',
        // NL Central
        'Chicago Cubs', 'Cincinnati Reds', 'Milwaukee Brewers', 'Pittsburgh Pirates', 'St. Louis Cardinals',
        // NL West
        'Arizona Diamondbacks', 'Colorado Rockies', 'Los Angeles Dodgers', 'San Diego Padres', 'San Francisco Giants'
      ],
      NPB: [
        // Central League
        'Yomiuri Giants', 'Hanshin Tigers', 'Hiroshima Carp', 'Chunichi Dragons', 'Yakult Swallows', 'Yokohama BayStars',
        // Pacific League
        'Fukuoka SoftBank Hawks', 'Chiba Lotte Marines', 'Orix Buffaloes', 'Seibu Lions', 'Tohoku Rakuten Eagles', 'Hokkaido Nippon-Ham Fighters'
      ],
      KBO: [
        'LG Twins', 'Kia Tigers', 'Samsung Lions', 'Hanwha Eagles', 'Doosan Bears',
        'NC Dinos', 'SSG Landers', 'KT Wiz Suwon', 'Lotte Giants'
      ],
      LMB: [
        'Diablos Rojos', 'Sultanes de Monterrey', 'Bravos de León', 'Pericos de Puebla', 'Toros de Durango',
        'Generales de Durango', 'Rieleros de Aguascalientes', 'Industriales de Monterrey', 'Acereros de Monclova'
      ],
      AAA: [
        // International League
        'Buffalo Bisons', 'Charlotte Knights', 'Durham Bulls', 'Indianapolis Indians', 'Lehigh Valley IronPigs',
        'Louisville Bats', 'Norfolk Tides', 'Providence Greyhouds', 'Rochester Red Wings', 'Scranton Wilkes-Barre RailRiders',
        'Syracuse Mets', 'Gwinnett Stripers', 'Memphis Redbirds', 'Omaha Storm Chasers',
        // Pacific Coast League
        'Albuquerque Isotopes', 'Colorado Springs Sky Sox', 'El Paso Chihuahuas', 'Fresno Grizzlies',
        'Las Vegas Aviators', 'Long Beach Breakers', 'Oklahoma City Dodgers', 'Reno Aces',
        'Sacramento River Cats', 'Salt Lake Bees', 'Tacoma Rainiers', 'Toledo Mud Hens', 'Tucson Roadrunners',
        'Columbus Clippers'
      ]
    };

    // Real APIs
    async function fetchMLB() {
      const now = Date.now();
      if (API_CACHE['mlb'] && now - API_CACHE['mlb'].time < CACHE_TTL) return API_CACHE['mlb'].data;

      try {
        const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard');
        const data = await response.json();
        
        const games = (data.events || []).map(event => {
          try {
            const comp = event.competitions?.[0];
            if (!comp) return null;
            
            const homeTeam = comp.home?.team?.displayName || comp.home?.name || 'Unknown';
            const awayTeam = comp.away?.team?.displayName || comp.away?.name || 'Unknown';
            
            return {
              league: 'MLB',
              id: event.id,
              homeTeam: homeTeam,
              awayTeam: awayTeam,
              homeScore: comp.home?.score || 0,
              awayScore: comp.away?.score || 0,
              status: comp.status?.type || 'STATUS_SCHEDULED',
              inning: comp.inning || 0,
              timestamp: event.date
            };
          } catch (e) {
            return null;
          }
        }).filter(g => g !== null);
        
        API_CACHE['mlb'] = { time: now, data: games };
        return games;
      } catch (e) {
        console.warn('MLB API error:', e);
        return [];
      }
    }

    async function fetchNPB() {
      const now = Date.now();
      if (API_CACHE['npb'] && now - API_CACHE['npb'].time < CACHE_TTL) return API_CACHE['npb'].data;

      try {
        const response = await fetch('https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=4591');
        const data = await response.json();
        
        let games = [];
        if (data.results) {
          games = data.results.slice(0, 20).map(event => {
            const status = event.intStatus === '3' ? 'STATUS_IN_PROGRESS' : event.intStatus === '4' ? 'STATUS_FINAL' : 'STATUS_SCHEDULED';
            return {
              league: 'NPB',
              id: event.idEvent,
              homeTeam: event.strHomeTeam,
              awayTeam: event.strAwayTeam,
              homeScore: parseInt(event.intHomeScore) || 0,
              awayScore: parseInt(event.intAwayScore) || 0,
              status: status,
              inning: 9,
              timestamp: event.dateEvent
            };
          });
        }
        
        API_CACHE['npb'] = { time: now, data: games };
        return games;
      } catch (e) {
        console.warn('NPB API error:', e);
        return [];
      }
    }

    async function fetchKBO() {
      const now = Date.now();
      if (API_CACHE['kbo'] && now - API_CACHE['kbo'].time < CACHE_TTL) return API_CACHE['kbo'].data;
      // Placeholder - will add real API
      API_CACHE['kbo'] = { time: now, data: [] };
      return [];
    }

    async function fetchLMB() {
      const now = Date.now();
      if (API_CACHE['lmb'] && now - API_CACHE['lmb'].time < CACHE_TTL) return API_CACHE['lmb'].data;
      // Placeholder - will add real API
      API_CACHE['lmb'] = { time: now, data: [] };
      return [];
    }

    async function fetchAAA() {
      const now = Date.now();
      if (API_CACHE['aaa'] && now - API_CACHE['aaa'].time < CACHE_TTL) return API_CACHE['aaa'].data;
      // Placeholder - will add real API
      API_CACHE['aaa'] = { time: now, data: [] };
      return [];
    }

    // Render card
    function renderCard(game) {
      const isLive = game.status === 'STATUS_IN_PROGRESS';
      const statusText = isLive ? `Live - Inning ${game.inning}` : game.status === 'STATUS_FINAL' ? 'Final' : 'Upcoming';

      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';

      const shadow = document.createElement('div');
      shadow.className = 'card-shadow';
      wrap.appendChild(shadow);

      const card = document.createElement('div');
      card.className = `card ${isLive ? 'live' : ''}`;
      card.innerHTML = `
        <div class="card-matchup">
          <div class="card-team">
            <span class="team-name">${game.awayTeam}</span>
            <span class="team-score">${game.awayScore}</span>
          </div>
          <div class="card-team">
            <span class="team-name">${game.homeTeam}</span>
            <span class="team-score">${game.homeScore}</span>
          </div>
        </div>
        <div class="card-status">${statusText}</div>
      `;

      wrap.appendChild(card);
      return wrap;
    }

    // Sidebar team picker
    function renderSidebar() {
      Object.entries(leagueTeams).forEach(([league, teams]) => {
        const list = document.getElementById(`${league.toLowerCase()}TeamList`);
        list.innerHTML = '';
        
        teams.forEach(team => {
          const item = document.createElement('label');
          item.className = `team-item ${favorites.has(team) ? 'selected' : ''}`;
          
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'team-checkbox';
          checkbox.checked = favorites.has(team);
          checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
              favorites.add(team);
            } else {
              favorites.delete(team);
            }
            localStorage.setItem('baseball_favorites', JSON.stringify(Array.from(favorites)));
            renderSidebar();
            renderAll();
          });
          
          item.appendChild(checkbox);
          item.appendChild(document.createTextNode(team));
          list.appendChild(item);
        });
      });
    }

    function updateLive() {
      const container = document.getElementById('live-content');
      container.innerHTML = '';
      const liveGames = Object.values(allGames).flat().filter(g => g.status === 'STATUS_IN_PROGRESS');
      
      if (liveGames.length === 0) {
        container.innerHTML = '<div class="empty-state">No live games right now.</div>';
        return;
      }
      liveGames.forEach(g => container.appendChild(renderCard(g)));
    }

    function renderLeague(code) {
      const container = document.getElementById(`${code}-content`);
      const games = allGames[code] || [];
      container.innerHTML = '';
      
      if (games.length === 0) {
        container.innerHTML = '<div class="empty-state">No games scheduled.</div>';
        return;
      }
      
      const sorted = [...games].sort((a, b) => (a.status === 'STATUS_IN_PROGRESS' ? -1 : 1));
      sorted.forEach(g => container.appendChild(renderCard(g)));
    }

    async function renderAll() {
      allGames.mlb = await fetchMLB();
      allGames.npb = await fetchNPB();
      allGames.kbo = await fetchKBO();
      allGames.lmb = await fetchLMB();
      allGames.aaa = await fetchAAA();
      
      updateLive();
      ['mlb', 'npb', 'kbo', 'lmb', 'aaa'].forEach(code => renderLeague(code));
    }

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const hamburgerBtn = document.getElementById('hamburgerBtn');

    hamburgerBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    });

    // Section toggle
    document.querySelectorAll('.section-header').forEach(header => {
      header.addEventListener('click', () => {
        const content = header.nextElementSibling;
        const toggle = header.querySelector('.section-toggle');
        content.classList.toggle('collapsed');
        toggle.classList.toggle('collapsed');
      });
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      Object.keys(API_CACHE).forEach(k => delete API_CACHE[k]);
      renderAll();
    });

    // Init shapes
    function initShapes() {
      const layer = document.getElementById('shapes-layer');
      const shapes = [
        { cx: 20, cy: 100, r: 16, fill: '#1a6ef5' },
        { cx: 60, cy: 400, r: 12, fill: '#e8234a' },
        { cx: 40, cy: 700, r: 10, fill: '#00a86b' },
        { cx: 70, cy: 200, r: 8, fill: '#f5620a' },
        { cx: 30, cy: 900, r: 14, fill: '#8b1af5' }
      ];
      
      shapes.forEach(s => {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'ms');
        svg.setAttribute('style', `--r: ${Math.random() * 35}deg; top: ${s.cy}px; left: ${s.cx}px;`);
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('width', '60');
        svg.setAttribute('height', '60');
        
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '50');
        circle.setAttribute('cy', '50');
        circle.setAttribute('r', s.r);
        circle.setAttribute('fill', s.fill);
        svg.appendChild(circle);
        layer.appendChild(svg);
      });

      const shapeElements = document.querySelectorAll('.ms');
      const shapeData = Array.from(shapeElements).map((el, i) => ({
        el,
        threshold: Math.max(0, (parseFloat(el.style.top) || 0) - window.innerHeight * 0.75),
        delay: (i % 4) * 80,
        triggered: false
      }));

      function checkShapes() {
        const scrollY = window.scrollY;
        shapeData.forEach((item, i) => {
          if (!item.triggered && scrollY >= item.threshold) {
            shapeData[i].triggered = true;
            setTimeout(() => item.el.classList.add('visible'), item.delay);
          }
        });
      }
      checkShapes();
      window.addEventListener('scroll', checkShapes, { passive: true });
    }

    // Init
    initShapes();
    renderSidebar();
    renderAll();
  </script>
</body>
</html>
