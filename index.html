<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#15120a">
  <title>BB Scores</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 600;
      background-color: #fdf8f0;
      background-image: radial-gradient(circle, #c4bdb0 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      background-attachment: fixed;
      color: #15120a;
    }

    /* ── Shapes ── */
    #shapes-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .ms {
      position: absolute;
      opacity: 0;
      transform: scale(0.4) rotate(var(--r, 0deg));
      transition: opacity 0.45s cubic-bezier(0.34,1.56,0.64,1), transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
    }
    .ms.visible { opacity: 1; transform: scale(1) rotate(var(--r, 0deg)); }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: #15120a;
      border-bottom: 6px solid #1a6ef5;
      padding: 14px 20px 12px;
    }
    .header-content { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Nunito', sans-serif; font-size: 28px; font-weight: 900; color: #1a6ef5; }
    .logo span { color: #fff; font-weight: 400; }
    .header-controls { display: flex; gap: 10px; }
    .icon-btn {
      background: #1a6ef5; color: white; border: none; border-radius: 11px;
      padding: 8px 14px; font-family: 'Nunito Sans', sans-serif;
      font-weight: 800; font-size: 16px; cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .icon-btn:hover { transform: scale(1.05); }
    .icon-btn:active { transform: scale(0.95); }

    /* ── Sidebar ── */
    .sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 150; display: none;
    }
    .sidebar-overlay.open { display: block; }
    .sidebar {
      position: fixed; top: 0; left: -310px; width: 290px; height: 100vh;
      background: #fffef9; border-right: 3px solid #ddd5c5;
      z-index: 200; transition: left 0.3s ease; overflow-y: auto;
    }
    .sidebar.open { left: 0; }
    .sidebar-top {
      background: #15120a; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sidebar-heading { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px; color: #1a6ef5; }
    .sidebar-close {
      background: none; border: none; color: #fff;
      font-size: 20px; cursor: pointer; font-weight: 900;
    }
    .sidebar-league { border-bottom: 2px solid #ddd5c5; }
    .sidebar-league-header {
      background: #fdf8f0; padding: 10px 20px;
      font-family: 'Nunito', sans-serif; font-weight: 900;
      font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase;
      color: #1a6ef5;
    }
    .team-list { padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
    .team-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; background: #fdf8f0;
      border: 2px solid #ddd5c5; border-radius: 9px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      transition: background 0.12s;
    }
    .team-item.selected { background: #dce9ff; border-color: #1a6ef5; }
    .team-item input[type=checkbox] { width: 15px; height: 15px; accent-color: #1a6ef5; cursor: pointer; flex-shrink: 0; }

    /* ── Main ── */
    .main {
      position: relative; z-index: 10;
      padding: 20px; padding-bottom: 48px;
      max-width: 600px; margin: 0 auto;
    }

    /* ── Section ── */
    .section { margin-bottom: 22px; }
    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; cursor: pointer; user-select: none;
    }
    .section-title {
      font-family: 'Nunito', sans-serif; font-size: 18px;
      font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .chevron { font-size: 14px; color: #5a5040; transition: transform 0.2s; }
    .chevron.down { transform: rotate(0deg); }
    .chevron.up { transform: rotate(180deg); }
    .section-body { overflow: hidden; transition: max-height 0.3s ease; max-height: 9999px; }
    .section-body.closed { max-height: 0; }

    /* ── Cards ── */
    .card-wrap { position: relative; margin-bottom: 14px; }
    .card-shadow {
      position: absolute; top: 5px; left: 5px; right: -5px; bottom: -5px;
      background: #b8ae9e; border-radius: 16px; z-index: 0;
    }
    .card {
      position: relative; z-index: 1;
      background: #fffef9; border: 2.5px solid #ddd5c5;
      border-left: 7px solid #1a6ef5; border-radius: 16px;
      padding: 12px 14px;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .card:hover { transform: translate(-2px,-2px); }
    .card.live { border-left-color: #e8234a; background: #fff5f7; }
    .card.fav { border-left-color: #f5a623; }
    .card.live.fav { border-left-color: #e8234a; }

    .card-teams { margin-bottom: 6px; }
    .card-team {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 5px;
    }
    .team-name { font-weight: 700; font-size: 13px; }
    .team-name.is-fav::after { content: ' ⭐'; font-size: 10px; }
    .team-score { font-weight: 900; font-size: 17px; color: #1a6ef5; }
    .card.live .team-score { color: #e8234a; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .card-status {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.3px; color: #5a5040;
    }
    .card.live .card-status { color: #e8234a; }
    .league-badge {
      font-size: 10px; font-weight: 800; padding: 2px 7px;
      border-radius: 6px; background: #dce9ff; color: #1a6ef5;
      text-transform: uppercase;
    }

    .empty-state { text-align: center; padding: 20px; color: #a09080; font-size: 13px; }
    .loading-state { text-align: center; padding: 20px; color: #a09080; font-size: 13px; font-style: italic; }
    .error-state {
      padding: 12px 14px; background: #fff5f7; border: 2px solid #e8234a;
      border-radius: 11px; color: #e8234a; font-size: 12px; font-weight: 700;
      margin-bottom: 14px;
    }

    @media (max-width: 480px) {
      .main { padding: 14px; }
      .logo { font-size: 22px; }
      .sidebar { width: 270px; left: -270px; }
    }
  </style>
</head>
<body>

<div id="shapes-layer" aria-hidden="true"></div>
<div class="sidebar-overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <span class="sidebar-heading">⭐ My Teams</span>
    <button class="sidebar-close" id="closeBtn">✕</button>
  </div>
  <div id="sidebar-leagues"></div>
</div>

<div class="header">
  <div class="header-content">
    <div class="logo">BB <span>Scores</span></div>
    <div class="header-controls">
      <button class="icon-btn" id="menuBtn" title="My Teams">☰</button>
      <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="section" id="sec-favs">
    <div class="section-header" data-sec="favs">
      <div class="section-title">⭐ My Teams Today</div>
      <div class="chevron down">▼</div>
    </div>
    <div class="section-body" id="body-favs">
      <div class="empty-state">Star your teams in the ☰ menu.</div>
    </div>
  </div>

  <div class="section" id="sec-live">
    <div class="section-header" data-sec="live">
      <div class="section-title">🔴 Live Now</div>
      <div class="chevron down">▼</div>
    </div>
    <div class="section-body" id="body-live">
      <div class="loading-state">Loading…</div>
    </div>
  </div>

  <div class="section" id="sec-mlb">
    <div class="section-header" data-sec="mlb">
      <div class="section-title">MLB</div>
      <div class="chevron down">▼</div>
    </div>
    <div class="section-body" id="body-mlb">
      <div class="loading-state">Loading…</div>
    </div>
  </div>

  <div class="section" id="sec-npb">
    <div class="section-header" data-sec="npb">
      <div class="section-title">NPB</div>
      <div class="chevron down">▼</div>
    </div>
    <div class="section-body" id="body-npb">
      <div class="loading-state">Loading…</div>
    </div>
  </div>

  <div class="section" id="sec-kbo">
    <div class="section-header" data-sec="kbo">
      <div class="section-title">KBO</div>
      <div class="chevron down">▼</div>
    </div>
    <div class="section-body" id="body-kbo">
      <div class="loading-state">Loading…</div>
    </div>
  </div>

  <div class="section" id="sec-lmb">
    <div class="section-header" data-sec="lmb">
      <div class="section-title">LMB</div>
      <div class="chevron down">▼</div>
    </div>
    <div class="section-body" id="body-lmb">
      <div class="loading-state">Loading…</div>
    </div>
  </div>

  <div class="section" id="sec-aaa">
    <div class="section-header" data-sec="aaa">
      <div class="section-title">AAA</div>
      <div class="chevron down">▼</div>
    </div>
    <div class="section-body" id="body-aaa">
      <div class="loading-state">Loading…</div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────
// State
// ─────────────────────────────
let allGames = { mlb:[], npb:[], kbo:[], lmb:[], aaa:[] };
let favorites = new Set(JSON.parse(localStorage.getItem('bb_favs') || '[]'));
let collapsed = new Set(JSON.parse(localStorage.getItem('bb_collapsed') || '[]'));

// ─────────────────────────────
// Complete Team Lists
// ─────────────────────────────
const TEAMS = {
  MLB: [
    // AL East
    'Baltimore Orioles','Boston Red Sox','New York Yankees','Tampa Bay Rays','Toronto Blue Jays',
    // AL Central
    'Chicago White Sox','Cleveland Guardians','Detroit Tigers','Kansas City Royals','Minnesota Twins',
    // AL West
    'Houston Astros','Los Angeles Angels','Oakland Athletics','Seattle Mariners','Texas Rangers',
    // NL East
    'Atlanta Braves','Miami Marlins','New York Mets','Philadelphia Phillies','Washington Nationals',
    // NL Central
    'Chicago Cubs','Cincinnati Reds','Milwaukee Brewers','Pittsburgh Pirates','St. Louis Cardinals',
    // NL West
    'Arizona Diamondbacks','Colorado Rockies','Los Angeles Dodgers','San Diego Padres','San Francisco Giants'
  ],
  NPB: [
    // Central League
    'Yomiuri Giants','Hanshin Tigers','Hiroshima Carp','Chunichi Dragons','Yakult Swallows','Yokohama BayStars',
    // Pacific League
    'Fukuoka SoftBank Hawks','Chiba Lotte Marines','Orix Buffaloes','Seibu Lions','Tohoku Rakuten Eagles','Hokkaido Nippon-Ham Fighters'
  ],
  KBO: [
    'LG Twins','Kia Tigers','Samsung Lions','Hanwha Eagles','Doosan Bears',
    'NC Dinos','SSG Landers','KT Wiz Suwon','Lotte Giants'
  ],
  LMB: [
    'Diablos Rojos','Sultanes de Monterrey','Bravos de León','Pericos de Puebla',
    'Toros de Durango','Generales de Durango','Rieleros de Aguascalientes',
    'Acereros de Monclova','Saraperos de Saltillo','Leones de Yucatan',
    'Guerreros de Oaxaca','Olmecas de Tabasco'
  ],
  AAA: [
    // International League (20 teams)
    'Buffalo Bisons','Charlotte Knights','Columbus Clippers','Durham Bulls',
    'Gwinnett Stripers','Indianapolis Indians','Iowa Cubs','Jacksonville Jumbo Shrimp',
    'Lehigh Valley IronPigs','Louisville Bats','Memphis Redbirds','Nashville Sounds',
    'Norfolk Tides','Omaha Storm Chasers','Rochester Red Wings',
    'Scranton/Wilkes-Barre RailRiders','St. Paul Saints','Syracuse Mets',
    'Toledo Mud Hens','Worcester Red Sox',
    // Pacific Coast League (10 teams)
    'Albuquerque Isotopes','El Paso Chihuahuas','Las Vegas Aviators',
    'Oklahoma City Comets','Reno Aces','Round Rock Express',
    'Sacramento River Cats','Salt Lake Bees','Sugar Land Space Cowboys',
    'Tacoma Rainiers'
  ]
};

// ─────────────────────────────
// Helpers
// ─────────────────────────────
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function parseStatus(raw) {
  if (!raw) return 'STATUS_SCHEDULED';
  const s = (raw.abstractGameState || raw.type || raw.name || '').toLowerCase();
  if (s.includes('progress') || s.includes('live') || s === 'in progress') return 'STATUS_IN_PROGRESS';
  if (s.includes('final') || s === 'f' || s === 'final') return 'STATUS_FINAL';
  return 'STATUS_SCHEDULED';
}

function statusLabel(game) {
  if (game.status === 'STATUS_IN_PROGRESS') {
    return game.inning ? `Live · Inning ${game.inning}` : 'Live';
  }
  if (game.status === 'STATUS_FINAL') return 'Final';
  if (game.startTime) return `⏰ ${game.startTime}`;
  return 'Upcoming';
}

function isFav(team) { return favorites.has(team); }

// ─────────────────────────────
// Fetch Functions
// ─────────────────────────────

// MLB — MLB StatsAPI (official, no key, CORS-open)
async function fetchMLB() {
  try {
    const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${today()}&hydrate=linescore`;
    const res = await fetch(url);
    const data = await res.json();
    const games = [];
    for (const date of (data.dates || [])) {
      for (const g of (date.games || [])) {
        const home = g.teams?.home;
        const away = g.teams?.away;
        if (!home || !away) continue;
        const status = parseStatus(g.status);
        const inning = g.linescore?.currentInning || g.status?.currentInning || 0;
        const startTime = g.gameDate ? new Date(g.gameDate).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}) : '';
        games.push({
          league: 'MLB', id: g.gamePk,
          homeTeam: home.team?.name || 'Home',
          awayTeam: away.team?.name || 'Away',
          homeScore: home.score ?? 0,
          awayScore: away.score ?? 0,
          status, inning, startTime
        });
      }
    }
    return games;
  } catch(e) {
    console.warn('MLB error:', e.message);
    return null; // null = error, [] = no games
  }
}

// NPB — SportsDB free tier (league id 4591)
async function fetchNPB() {
  try {
    const url = 'https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=4591';
    const res = await fetch(url);
    const data = await res.json();
    return (data.results || []).slice(0,20).map(e => ({
      league: 'NPB', id: e.idEvent,
      homeTeam: e.strHomeTeam, awayTeam: e.strAwayTeam,
      homeScore: parseInt(e.intHomeScore) || 0,
      awayScore: parseInt(e.intAwayScore) || 0,
      status: e.intStatus === '3' ? 'STATUS_IN_PROGRESS' : 'STATUS_FINAL',
      inning: 9, startTime: ''
    }));
  } catch(e) {
    console.warn('NPB error:', e.message);
    return null;
  }
}

// KBO — SportsDB (league id 4520)
async function fetchKBO() {
  try {
    const url = 'https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=4520';
    const res = await fetch(url);
    const data = await res.json();
    return (data.results || []).slice(0,20).map(e => ({
      league: 'KBO', id: e.idEvent,
      homeTeam: e.strHomeTeam, awayTeam: e.strAwayTeam,
      homeScore: parseInt(e.intHomeScore) || 0,
      awayScore: parseInt(e.intAwayScore) || 0,
      status: e.intStatus === '3' ? 'STATUS_IN_PROGRESS' : 'STATUS_FINAL',
      inning: 9, startTime: ''
    }));
  } catch(e) {
    console.warn('KBO error:', e.message);
    return null;
  }
}

// AAA — MLB StatsAPI sportId=17
async function fetchAAA() {
  try {
    const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=17&date=${today()}&hydrate=linescore`;
    const res = await fetch(url);
    const data = await res.json();
    const games = [];
    for (const date of (data.dates || [])) {
      for (const g of (date.games || [])) {
        const home = g.teams?.home;
        const away = g.teams?.away;
        if (!home || !away) continue;
        const status = parseStatus(g.status);
        const inning = g.linescore?.currentInning || 0;
        const startTime = g.gameDate ? new Date(g.gameDate).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}) : '';
        games.push({
          league: 'AAA', id: g.gamePk,
          homeTeam: home.team?.name || 'Home',
          awayTeam: away.team?.name || 'Away',
          homeScore: home.score ?? 0,
          awayScore: away.score ?? 0,
          status, inning, startTime
        });
      }
    }
    return games;
  } catch(e) {
    console.warn('AAA error:', e.message);
    return null;
  }
}

// LMB — no free reliable API, keep informative placeholder
async function fetchLMB() { return null; }

// ─────────────────────────────
// Render
// ─────────────────────────────
function makeCard(game) {
  const isLive = game.status === 'STATUS_IN_PROGRESS';
  const homeFav = isFav(game.homeTeam);
  const awayFav = isFav(game.awayTeam);
  const hasFav = homeFav || awayFav;

  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';

  const shadow = document.createElement('div');
  shadow.className = 'card-shadow';
  wrap.appendChild(shadow);

  const card = document.createElement('div');
  card.className = `card${isLive ? ' live' : ''}${hasFav ? ' fav' : ''}`;

  card.innerHTML = `
    <div class="card-teams">
      <div class="card-team">
        <span class="team-name${awayFav ? ' is-fav' : ''}">${game.awayTeam}</span>
        <span class="team-score">${game.awayScore}</span>
      </div>
      <div class="card-team">
        <span class="team-name${homeFav ? ' is-fav' : ''}">${game.homeTeam}</span>
        <span class="team-score">${game.homeScore}</span>
      </div>
    </div>
    <div class="card-footer">
      <span class="card-status">${statusLabel(game)}</span>
      <span class="league-badge">${game.league}</span>
    </div>
  `;

  wrap.appendChild(card);
  return wrap;
}

function renderSection(id, games, error) {
  const body = document.getElementById(`body-${id}`);
  body.innerHTML = '';

  if (error) {
    const el = document.createElement('div');
    el.className = 'error-state';
    el.textContent = `Could not load ${id.toUpperCase()} data. Will retry on next refresh.`;
    body.appendChild(el);
    return;
  }

  if (!games || games.length === 0) {
    body.innerHTML = '<div class="empty-state">No games scheduled today.</div>';
    return;
  }

  const sorted = [...games].sort((a,b) => {
    if (a.status === 'STATUS_IN_PROGRESS' && b.status !== 'STATUS_IN_PROGRESS') return -1;
    if (b.status === 'STATUS_IN_PROGRESS' && a.status !== 'STATUS_IN_PROGRESS') return 1;
    if (a.status === 'STATUS_SCHEDULED' && b.status === 'STATUS_FINAL') return -1;
    if (b.status === 'STATUS_SCHEDULED' && a.status === 'STATUS_FINAL') return 1;
    return 0;
  });

  sorted.forEach(g => body.appendChild(makeCard(g)));
}

function renderFavs() {
  const body = document.getElementById('body-favs');
  body.innerHTML = '';

  if (favorites.size === 0) {
    body.innerHTML = '<div class="empty-state">Open ☰ to pick your teams.</div>';
    return;
  }

  const favGames = Object.values(allGames).flat().filter(g =>
    g && (isFav(g.homeTeam) || isFav(g.awayTeam))
  );

  if (favGames.length === 0) {
    body.innerHTML = '<div class="empty-state">None of your teams are playing today.</div>';
    return;
  }

  const sorted = [...favGames].sort((a,b) => {
    if (a.status === 'STATUS_IN_PROGRESS' && b.status !== 'STATUS_IN_PROGRESS') return -1;
    if (b.status === 'STATUS_IN_PROGRESS' && a.status !== 'STATUS_IN_PROGRESS') return 1;
    return 0;
  });
  sorted.forEach(g => body.appendChild(makeCard(g)));
}

function renderLive() {
  const body = document.getElementById('body-live');
  body.innerHTML = '';

  const liveGames = Object.values(allGames).flat().filter(g => g && g.status === 'STATUS_IN_PROGRESS');

  if (liveGames.length === 0) {
    body.innerHTML = '<div class="empty-state">No games in progress right now.</div>';
    return;
  }
  liveGames.forEach(g => body.appendChild(makeCard(g)));
}

function renderAll() {
  renderFavs();
  renderLive();
  ['mlb','npb','kbo','lmb','aaa'].forEach(id => {
    renderSection(id, allGames[id], allGames[id] === null);
  });
}

// ─────────────────────────────
// Fetch All
// ─────────────────────────────
async function fetchAll() {
  document.getElementById('refreshBtn').textContent = '…';
  const [mlb, npb, kbo, lmb, aaa] = await Promise.all([
    fetchMLB(), fetchNPB(), fetchKBO(), fetchLMB(), fetchAAA()
  ]);
  allGames = { mlb, npb, kbo, lmb, aaa };
  renderAll();
  document.getElementById('refreshBtn').textContent = '↻';
}

// ─────────────────────────────
// Sidebar
// ─────────────────────────────
function buildSidebar() {
  const container = document.getElementById('sidebar-leagues');
  container.innerHTML = '';
  Object.entries(TEAMS).forEach(([league, teams]) => {
    const section = document.createElement('div');
    section.className = 'sidebar-league';
    section.innerHTML = `<div class="sidebar-league-header">${league}</div>`;
    const list = document.createElement('div');
    list.className = 'team-list';

    teams.forEach(team => {
      const label = document.createElement('label');
      label.className = `team-item${isFav(team) ? ' selected' : ''}`;

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = isFav(team);
      cb.addEventListener('change', () => {
        if (cb.checked) favorites.add(team);
        else favorites.delete(team);
        localStorage.setItem('bb_favs', JSON.stringify([...favorites]));
        label.className = `team-item${isFav(team) ? ' selected' : ''}`;
        renderFavs();
        renderAll();
      });

      label.appendChild(cb);
      label.appendChild(document.createTextNode(team));
      list.appendChild(label);
    });

    section.appendChild(list);
    container.appendChild(section);
  });
}

// ─────────────────────────────
// Section Collapse
// ─────────────────────────────
document.querySelectorAll('.section-header').forEach(header => {
  const sec = header.dataset.sec;
  const body = document.getElementById(`body-${sec}`);
  const chevron = header.querySelector('.chevron');

  if (collapsed.has(sec)) {
    body.classList.add('closed');
    chevron.classList.replace('down','up');
  }

  header.addEventListener('click', () => {
    const isOpen = !body.classList.contains('closed');
    body.classList.toggle('closed', isOpen);
    chevron.classList.toggle('down', !isOpen);
    chevron.classList.toggle('up', isOpen);
    if (isOpen) collapsed.add(sec); else collapsed.delete(sec);
    localStorage.setItem('bb_collapsed', JSON.stringify([...collapsed]));
  });
});

// ─────────────────────────────
// Sidebar Controls
// ─────────────────────────────
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

document.getElementById('menuBtn').addEventListener('click', () => {
  sidebar.classList.add('open');
  overlay.classList.add('open');
});
document.getElementById('closeBtn').addEventListener('click', () => {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
});
overlay.addEventListener('click', () => {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
});

document.getElementById('refreshBtn').addEventListener('click', fetchAll);

// ─────────────────────────────
// Memphis Shapes
// ─────────────────────────────
function initShapes() {
  const layer = document.getElementById('shapes-layer');
  const defs = [
    { type:'circle', cx:18, cy:120, r:18, fill:'#1a6ef5' },
    { type:'rect',   x:55,  y:260, w:22, h:22, rot:20, stroke:'#e8234a', sw:4 },
    { type:'circle', cx:22, cy:420, r:12, fill:'none', stroke:'#00a86b', sw:5 },
    { type:'wave',   x:30,  y:580, stroke:'#f5620a', sw:4 },
    { type:'poly',   x:52,  y:740, fill:'#8b1af5' },
    { type:'circle', cx:62, cy:200, r:9,  fill:'#f5620a' },
    { type:'rect',   x:42,  y:490, w:18, h:18, rot:-18, stroke:'#8b1af5', sw:3 },
    { type:'circle', cx:20, cy:880, r:14, fill:'#1a6ef5', opacity:0.6 },
    { type:'wave',   x:38,  y:1050, stroke:'#e8234a', sw:3 },
    { type:'circle', cx:65, cy:650, r:10, fill:'none', stroke:'#f5a623', sw:4 },
  ];

  defs.forEach((d, i) => {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'ms');
    const rot = (i * 13 + 7) % 35;
    svg.style.cssText = `--r:${rot}deg; top:${d.cy||d.y}px; left:${d.cx||d.x}px;`;
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('width','64'); svg.setAttribute('height','64');

    let el;
    if (d.type === 'circle') {
      el = document.createElementNS(ns, 'circle');
      el.setAttribute('cx','50'); el.setAttribute('cy','50'); el.setAttribute('r', d.r);
      el.setAttribute('fill', d.fill||'none');
      if (d.stroke) { el.setAttribute('stroke', d.stroke); el.setAttribute('stroke-width', d.sw||4); }
    } else if (d.type === 'rect') {
      el = document.createElementNS(ns, 'rect');
      el.setAttribute('x','39'); el.setAttribute('y','39');
      el.setAttribute('width', d.w); el.setAttribute('height', d.h);
      el.setAttribute('fill','none');
      el.setAttribute('stroke', d.stroke||'#000'); el.setAttribute('stroke-width', d.sw||4);
      el.setAttribute('transform',`rotate(${d.rot||0} 50 50)`);
    } else if (d.type === 'wave') {
      el = document.createElementNS(ns, 'path');
      el.setAttribute('d','M20,50 Q35,30 50,50 T80,50');
      el.setAttribute('fill','none');
      el.setAttribute('stroke', d.stroke||'#000'); el.setAttribute('stroke-width', d.sw||4);
      el.setAttribute('stroke-linecap','round');
    } else if (d.type === 'poly') {
      el = document.createElementNS(ns, 'polygon');
      el.setAttribute('points','50,15 80,80 20,80');
      el.setAttribute('fill', d.fill||'none');
    }
    if (el) { svg.appendChild(el); layer.appendChild(svg); }
  });

  const shapes = document.querySelectorAll('.ms');
  const data = Array.from(shapes).map((el,i) => ({
    el, triggered: false,
    threshold: Math.max(0, (parseFloat(el.style.top)||0) - window.innerHeight * 0.8),
    delay: (i % 4) * 80
  }));
  function check() {
    const sy = window.scrollY;
    data.forEach((d,i) => {
      if (!d.triggered && sy >= d.threshold) {
        data[i].triggered = true;
        setTimeout(() => d.el.classList.add('visible'), d.delay);
      }
    });
  }
  check();
  window.addEventListener('scroll', check, { passive: true });
}

// ─────────────────────────────
// Init
// ─────────────────────────────
initShapes();
buildSidebar();
fetchAll();
setInterval(fetchAll, 45000);
</script>
