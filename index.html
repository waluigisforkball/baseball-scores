<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#15120a">
  <title>BB Scores</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 600;
      background-color: #fdf8f0;
      background-image: radial-gradient(circle, #c4bdb0 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      background-attachment: fixed;
      color: #15120a;
      line-height: 1.5;
    }

    #shapes-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ms {
      position: absolute;
      opacity: 0;
      transform: scale(0.4) rotate(var(--r, 0deg));
      transition: opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .ms.visible {
      opacity: 1;
      transform: scale(1) rotate(var(--r, 0deg));
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #15120a;
      border-bottom: 6px solid #1a6ef5;
      padding: 14px 20px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
    }

    .logo {
      font-family: 'Nunito', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #1a6ef5;
    }

    .logo span {
      color: #ffffff;
      font-weight: 400;
    }

    .refresh-btn {
      background: #1a6ef5;
      color: white;
      border: none;
      border-radius: 11px;
      padding: 8px 14px;
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .refresh-btn:hover {
      transform: scale(1.05);
    }
    .refresh-btn:active {
      transform: scale(0.95);
    }

    .main {
      position: relative;
      z-index: 10;
      padding: 20px;
      padding-bottom: 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }

    .section-title {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-toggle {
      font-size: 16px;
      color: #5a5040;
      transition: transform 0.2s;
    }
    .section-toggle.collapsed {
      transform: rotate(-90deg);
    }

    .section-content {
      max-height: 10000px;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .section-content.collapsed {
      max-height: 0;
    }

    .card-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .card-shadow {
      position: absolute;
      top: 5px;
      left: 5px;
      right: -5px;
      bottom: -5px;
      background: #b8ae9e;
      border-radius: 16px;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: #fffef9;
      border: 2.5px solid #ddd5c5;
      border-left-width: 7px;
      border-left-color: #1a6ef5;
      border-radius: 16px;
      padding: 12px 14px;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .card:hover {
      transform: translate(-2px, -2px);
    }

    .card.live {
      border-left-color: #e8234a;
      background: #fff5f7;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card-matchup {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
    }

    .card-team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .team-name {
      font-weight: 700;
      font-size: 13px;
    }

    .team-score {
      font-weight: 900;
      font-size: 16px;
      color: #1a6ef5;
    }

    .card.live .team-score {
      color: #e8234a;
    }

    .card-status {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #5a5040;
    }

    .card.live .card-status {
      color: #e8234a;
      font-weight: 900;
    }

    .card-inning {
      font-size: 10px;
      color: #a09080;
      margin-top: 6px;
    }

    .favorite-btn {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.15s;
    }
    .favorite-btn:hover {
      transform: scale(1.2);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #5a5040;
      font-size: 14px;
    }

    .error {
      background: #ffdde3;
      border: 2px solid #e8234a;
      border-radius: 11px;
      padding: 12px;
      margin-bottom: 16px;
      color: #e8234a;
      font-size: 13px;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #a09080;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .main {
        padding: 16px;
      }

      .logo {
        font-size: 24px;
      }

      .card {
        padding: 10px 12px;
      }

      .team-name {
        font-size: 12px;
      }

      .team-score {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="shapes-layer" aria-hidden="true"></div>

  <div class="header">
    <div class="header-content">
      <div class="logo">BB <span>Scores</span></div>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <div class="main">
    <div id="errorContainer"></div>

    <div class="section">
      <div class="section-header" data-section="favorites">
        <div class="section-title">
          <span>⭐ Favorites</span>
        </div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="favorites-content">
        <div class="empty-state">No favorites yet. Star a team to add it here.</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header" data-section="live">
        <div class="section-title">
          <span>🔴 Live Now</span>
        </div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="live-content">
        <div class="loading">Loading live games...</div>
      </div>
    </div>

    <div class="section" data-league="MLB">
      <div class="section-header" data-section="mlb">
        <div class="section-title">
          <span>MLB</span>
        </div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="mlb-content">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="section" data-league="NPB">
      <div class="section-header" data-section="npb">
        <div class="section-title">
          <span>NPB</span>
        </div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="npb-content">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="section" data-league="KBO">
      <div class="section-header" data-section="kbo">
        <div class="section-title">
          <span>KBO</span>
        </div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="kbo-content">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="section" data-league="LMB">
      <div class="section-header" data-section="lmb">
        <div class="section-title">
          <span>LMB</span>
        </div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="lmb-content">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="section" data-league="AAA">
      <div class="section-header" data-section="aaa">
        <div class="section-title">
          <span>AAA</span>
        </div>
        <div class="section-toggle"></div>
      </div>
      <div class="section-content" id="aaa-content">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const API_CACHE = {};
    const CACHE_TTL = 3000; // 3 seconds for rapid refresh
    let allGames = {};
    let favorites = new Set(JSON.parse(localStorage.getItem('baseball_favorites') || '[]'));
    let lastRefresh = 0;
    let autoRefreshInterval = null;

    const leagues = {
      MLB: { id: 'mlb', shortName: 'MLB', color: '#1a6ef5' },
      NPB: { id: 'npb', shortName: 'NPB', color: '#1a6ef5' },
      KBO: { id: 'kbo', shortName: 'KBO', color: '#1a6ef5' },
      LMB: { id: 'lmb', shortName: 'LMB', color: '#1a6ef5' },
      AAA: { id: 'aaa', shortName: 'AAA', color: '#1a6ef5' }
    };

    // Memphis shapes
    function initShapes() {
      const shapesLayer = document.getElementById('shapes-layer');
      const shapes = [
        { type: 'circle', cx: 20, cy: 100, r: 16, fill: '#1a6ef5', stroke: 4 },
        { type: 'rect', x: 40, y: 250, w: 24, h: 24, rotate: 15, fill: 'none', stroke: '#e8234a', strokeW: 4 },
        { type: 'circle', cx: 60, cy: 400, r: 12, fill: 'none', stroke: '#00a86b', strokeW: 5 },
        { type: 'wave', x: 30, y: 550, fill: 'none', stroke: '#f5620a', strokeW: 4 },
        { type: 'triangle', x: 50, y: 700, fill: '#8b1af5', opacity: 0.7 },
        { type: 'plus', x: 40, y: 850, fill: 'none', stroke: '#1a6ef5', strokeW: 4 },
        { type: 'zigzag', x: 35, y: 1000, stroke: '#e8234a', strokeW: 3 },
        { type: 'diamond', cx: 55, cy: 1150, r: 14, fill: 'none', stroke: '#00a86b', strokeW: 4 },
        { type: 'circle', cx: 70, cy: 200, r: 10, fill: '#f5620a' },
        { type: 'rect', x: 45, y: 450, w: 18, h: 18, rotate: -20, fill: 'none', stroke: '#8b1af5', strokeW: 3 },
        { type: 'dashes', cx: 65, cy: 600, r: 16, stroke: '#1a6ef5', strokeW: 4 },
        { type: 'star', x: 50, y: 800, fill: '#f5a623' },
        { type: 'cluster', x: 40, y: 950, colors: ['#1a6ef5', '#e8234a', '#00a86b'] },
        { type: 'concentric', cx: 60, cy: 1100, rOuter: 18, rInner: 10, stroke: '#f5620a', strokeW: 3 }
      ];

      shapes.forEach((shape, i) => {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', `ms`);
        svg.setAttribute('style', `--r: ${Math.random() * 35}deg; ${shape.cy ? `top: ${shape.cy}px` : `top: ${shape.y}px`}; ${shape.cx ? `left: ${shape.cx}px` : `left: ${shape.x}px`};`);
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('width', '60');
        svg.setAttribute('height', '60');

        let g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

        if (shape.type === 'circle') {
          let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', '50');
          circle.setAttribute('cy', '50');
          circle.setAttribute('r', shape.r);
          circle.setAttribute('fill', shape.fill || 'none');
          circle.setAttribute('stroke', shape.stroke || 'none');
          circle.setAttribute('stroke-width', shape.strokeW || 0);
          g.appendChild(circle);
        } else if (shape.type === 'rect') {
          let rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', '38');
          rect.setAttribute('y', '38');
          rect.setAttribute('width', '24');
          rect.setAttribute('height', '24');
          rect.setAttribute('fill', shape.fill || 'none');
          rect.setAttribute('stroke', shape.stroke || 'none');
          rect.setAttribute('stroke-width', shape.strokeW || 0);
          rect.setAttribute('transform', `rotate(${shape.rotate} 50 50)`);
          g.appendChild(rect);
        } else if (shape.type === 'wave') {
          let path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', 'M 20 50 Q 35 35 50 50 T 80 50');
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', shape.stroke || '#000');
          path.setAttribute('stroke-width', shape.strokeW || 2);
          path.setAttribute('stroke-linecap', 'round');
          g.appendChild(path);
        } else if (shape.type === 'triangle') {
          let poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          poly.setAttribute('points', '50,20 80,80 20,80');
          poly.setAttribute('fill', shape.fill || 'none');
          poly.setAttribute('stroke', shape.stroke || 'none');
          poly.setAttribute('stroke-width', shape.strokeW || 0);
          g.appendChild(poly);
        } else if (shape.type === 'zigzag') {
          let path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', 'M 30 30 L 70 50 L 30 70');
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', shape.stroke || '#000');
          path.setAttribute('stroke-width', shape.strokeW || 2);
          path.setAttribute('stroke-linecap', 'round');
          g.appendChild(path);
        } else if (shape.type === 'star') {
          let poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          poly.setAttribute('points', '50,10 61,39 90,39 67,57 78,86 50,68 22,86 33,57 10,39 39,39');
          poly.setAttribute('fill', shape.fill || 'none');
          poly.setAttribute('stroke', shape.stroke || 'none');
          g.appendChild(poly);
        } else if (shape.type === 'cluster') {
          [16, 10, 6].forEach((r, idx) => {
            let c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            c.setAttribute('cx', 50 + idx * 12);
            c.setAttribute('cy', 50);
            c.setAttribute('r', r);
            c.setAttribute('fill', shape.colors[idx] || '#000');
            g.appendChild(c);
          });
        } else if (shape.type === 'concentric') {
          let c1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          c1.setAttribute('cx', '50');
          c1.setAttribute('cy', '50');
          c1.setAttribute('r', '18');
          c1.setAttribute('fill', 'none');
          c1.setAttribute('stroke', shape.stroke || '#000');
          c1.setAttribute('stroke-width', shape.strokeW || 2);
          g.appendChild(c1);

          let c2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          c2.setAttribute('cx', '50');
          c2.setAttribute('cy', '50');
          c2.setAttribute('r', '10');
          c2.setAttribute('fill', 'none');
          c2.setAttribute('stroke', shape.stroke || '#000');
          c2.setAttribute('stroke-width', shape.strokeW || 2);
          g.appendChild(c2);
        }

        svg.appendChild(g);
        shapesLayer.appendChild(svg);
      });

      // Trigger shapes on scroll
      const shapeElements = document.querySelectorAll('.ms');
      const shapeData = Array.from(shapeElements).map((el, i) => {
        const top = parseFloat(el.style.top) || 0;
        const threshold = Math.max(0, top - window.innerHeight * 0.75);
        const delay = (i % 4) * 80;
        return { el, threshold, delay, triggered: false };
      });

      function checkShapes() {
        const scrollY = window.scrollY;
        shapeData.forEach((item, i) => {
          if (!item.triggered && scrollY >= item.threshold) {
            shapeData[i].triggered = true;
            setTimeout(() => item.el.classList.add('visible'), item.delay);
          }
        });
      }
      checkShapes();
      window.addEventListener('scroll', checkShapes, { passive: true });
    }

    // ESPN MLB API
    async function fetchMLB() {
      const now = Date.now();
      if (API_CACHE['mlb'] && now - API_CACHE['mlb'].time < CACHE_TTL) {
        return API_CACHE['mlb'].data;
      }

      try {
        const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard');
        const data = await response.json();
        
        const games = (data.events || []).map(event => {
          const comp = event.competitions[0];
          const statusMap = {
            'STATUS_SCHEDULED': 'STATUS_SCHEDULED',
            'STATUS_IN_PROGRESS': 'STATUS_IN_PROGRESS',
            'STATUS_FINAL': 'STATUS_FINAL',
            'STATUS_FINAL_OT': 'STATUS_FINAL'
          };
          
          return {
            league: 'MLB',
            id: event.id,
            homeTeam: comp.home.team.displayName,
            awayTeam: comp.away.team.displayName,
            homeScore: comp.home.score || 0,
            awayScore: comp.away.score || 0,
            status: statusMap[comp.status.type] || comp.status.type,
            statusDetail: comp.status.detail || '',
            inning: comp.inning || comp.period || 0,
            timestamp: event.date
          };
        });
        
        API_CACHE['mlb'] = { time: now, data: games };
        return games;
      } catch (e) {
        console.error('MLB fetch error:', e);
        return [];
      }
    }

    // NPB via SportsDB
    async function fetchNPB() {
      const now = Date.now();
      if (API_CACHE['npb'] && now - API_CACHE['npb'].time < CACHE_TTL) {
        return API_CACHE['npb'].data;
      }

      try {
        const today = new Date().toISOString().split('T')[0];
        const response = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=4591`);
        const data = await response.json();
        
        let games = [];
        if (data.results) {
          games = data.results.slice(0, 10).map(event => {
            const status = event.intStatus ? (event.intStatus === '3' ? 'STATUS_IN_PROGRESS' : event.intStatus === '4' ? 'STATUS_FINAL' : 'STATUS_SCHEDULED') : 'STATUS_FINAL';
            return {
              league: 'NPB',
              id: event.idEvent,
              homeTeam: event.strHomeTeam,
              awayTeam: event.strAwayTeam,
              homeScore: parseInt(event.intHomeScore) || 0,
              awayScore: parseInt(event.intAwayScore) || 0,
              status: status,
              inning: 9,
              timestamp: event.dateEvent
            };
          });
        }
        API_CACHE['npb'] = { time: now, data: games };
        return games;
      } catch (e) {
        console.error('NPB fetch error:', e);
        return [];
      }
    }

    // KBO via Sofascore (browser-friendly)
    async function fetchKBO() {
      const now = Date.now();
      if (API_CACHE['kbo'] && now - API_CACHE['kbo'].time < CACHE_TTL) {
        return API_CACHE['kbo'].data;
      }

      try {
        // Using Sofascore API which allows CORS
        const response = await fetch('https://api.sofascore.com/api/v1/sport/baseball/events/today?lang=en');
        const data = await response.json();
        
        // Filter for KBO (tournament ID 11204)
        let games = [];
        if (data.events) {
          games = data.events
            .filter(e => e.tournament && e.tournament.id === 11204)
            .slice(0, 10)
            .map(event => {
              const status = event.status === 'inprogress' ? 'STATUS_IN_PROGRESS' : event.status === 'finished' ? 'STATUS_FINAL' : 'STATUS_SCHEDULED';
              return {
                league: 'KBO',
                id: event.id,
                homeTeam: event.homeTeam.name,
                awayTeam: event.awayTeam.name,
                homeScore: event.homeScore.current || 0,
                awayScore: event.awayScore.current || 0,
                status: status,
                inning: event.currentPeriod || 0,
                timestamp: new Date(event.startTimestamp * 1000).toISOString()
              };
            });
        }
        API_CACHE['kbo'] = { time: now, data: games };
        return games;
      } catch (e) {
        console.error('KBO fetch error:', e);
        return [];
      }
    }

    // AAA via Sofascore (browser-friendly)
    async function fetchAAA() {
      const now = Date.now();
      if (API_CACHE['aaa'] && now - API_CACHE['aaa'].time < CACHE_TTL) {
        return API_CACHE['aaa'].data;
      }

      try {
        const response = await fetch('https://api.sofascore.com/api/v1/sport/baseball/events/today?lang=en');
        const data = await response.json();
        
        // Filter for AAA (tournament ID 17711)
        let games = [];
        if (data.events) {
          games = data.events
            .filter(e => e.tournament && e.tournament.id === 17711)
            .slice(0, 10)
            .map(event => {
              const status = event.status === 'inprogress' ? 'STATUS_IN_PROGRESS' : event.status === 'finished' ? 'STATUS_FINAL' : 'STATUS_SCHEDULED';
              return {
                league: 'AAA',
                id: event.id,
                homeTeam: event.homeTeam.name,
                awayTeam: event.awayTeam.name,
                homeScore: event.homeScore.current || 0,
                awayScore: event.awayScore.current || 0,
                status: status,
                inning: event.currentPeriod || 0,
                timestamp: new Date(event.startTimestamp * 1000).toISOString()
              };
            });
        }
        API_CACHE['aaa'] = { time: now, data: games };
        return games;
      } catch (e) {
        console.error('AAA fetch error:', e);
        return [];
      }
    }

    // LMB placeholder (needs Data Sports Group API key)
    async function fetchLMB() {
      const now = Date.now();
      if (API_CACHE['lmb'] && now - API_CACHE['lmb'].time < CACHE_TTL) {
        return API_CACHE['lmb'].data;
      }

      // Mock data - replace with Data Sports Group API when key available
      const mockData = [
        { league: 'LMB', id: 'lmb1', homeTeam: 'Diablos Rojos', awayTeam: 'Sultanes de Monterrey', homeScore: 6, awayScore: 4, status: 'STATUS_FINAL', inning: 9 }
      ];
      
      API_CACHE['lmb'] = { time: now, data: mockData };
      return mockData;
    }

    // Render game card
    function renderCard(game, isFavorite = false) {
      const isLive = game.status === 'STATUS_IN_PROGRESS';
      const isScheduled = game.status === 'STATUS_SCHEDULED';
      
      let statusText = 'Final';
      if (isLive) statusText = `Live - ${game.inning || game.period || 0}${game.league === 'MLB' ? ' in' : ''}`;
      if (isScheduled) statusText = 'Upcoming';

      const homeKey = `${game.league}-${game.homeTeam}`;
      const awayKey = `${game.league}-${game.awayTeam}`;

      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';

      const shadow = document.createElement('div');
      shadow.className = 'card-shadow';
      wrap.appendChild(shadow);

      const card = document.createElement('div');
      card.className = `card ${isLive ? 'live' : ''}`;
      card.innerHTML = `
        <div class="card-header">
          <div class="card-matchup">
            <div class="card-team">
              <span class="team-name">${game.awayTeam}</span>
              <span class="team-score">${game.awayScore}</span>
            </div>
            <div class="card-team">
              <span class="team-name">${game.homeTeam}</span>
              <span class="team-score">${game.homeScore}</span>
            </div>
          </div>
          <button class="favorite-btn" data-away="${awayKey}" data-home="${homeKey}" data-game-id="${game.id}">
            ${favorites.has(homeKey) || favorites.has(awayKey) ? '⭐' : '☆'}
          </button>
        </div>
        <div class="card-status">${statusText}</div>
        ${isLive ? `<div class="card-inning">${game.league === 'MLB' ? 'Inning' : 'Period'} ${game.inning || game.period || 0}</div>` : ''}
      `;

      card.querySelector('.favorite-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFavorite(homeKey, awayKey);
        updateFavoritesDisplay();
        renderAllGames();
      });

      wrap.appendChild(card);
      return wrap;
    }

    // Toggle favorite
    function toggleFavorite(homeKey, awayKey) {
      if (favorites.has(homeKey)) {
        favorites.delete(homeKey);
      } else if (favorites.has(awayKey)) {
        favorites.delete(awayKey);
      } else {
        favorites.add(homeKey);
      }
      localStorage.setItem('baseball_favorites', JSON.stringify(Array.from(favorites)));
    }

    // Update favorites section
    function updateFavoritesDisplay() {
      const container = document.getElementById('favorites-content');
      container.innerHTML = '';

      if (favorites.size === 0) {
        container.innerHTML = '<div class="empty-state">No favorites yet. Star a team to add it here.</div>';
        return;
      }

      const allLiveGames = Object.values(allGames).flat().filter(g => g.status === 'STATUS_IN_PROGRESS' || g.status === 'STATUS_FINAL');
      const favoriteGames = allLiveGames.filter(g => {
        const homeKey = `${g.league}-${g.homeTeam}`;
        const awayKey = `${g.league}-${g.awayTeam}`;
        return favorites.has(homeKey) || favorites.has(awayKey);
      });

      if (favoriteGames.length === 0) {
        container.innerHTML = '<div class="empty-state">No games for your favorite teams today.</div>';
        return;
      }

      favoriteGames.forEach(game => {
        container.appendChild(renderCard(game, true));
      });
    }

    // Update live section
    function updateLiveDisplay() {
      const container = document.getElementById('live-content');
      container.innerHTML = '';

      const liveGames = Object.values(allGames)
        .flat()
        .filter(g => g.status === 'STATUS_IN_PROGRESS')
        .sort((a, b) => (b.inning || b.period || 0) - (a.inning || a.period || 0));

      if (liveGames.length === 0) {
        container.innerHTML = '<div class="empty-state">No live games right now. Check back soon!</div>';
        return;
      }

      liveGames.forEach(game => {
        container.appendChild(renderCard(game));
      });
    }

    // Render league section
    function renderLeague(leagueCode) {
      const container = document.getElementById(`${leagueCode}-content`);
      const games = allGames[leagueCode] || [];

      container.innerHTML = '';

      if (games.length === 0) {
        container.innerHTML = '<div class="empty-state">No games scheduled today.</div>';
        return;
      }

      const sorted = [...games].sort((a, b) => {
        const aLive = a.status === 'STATUS_IN_PROGRESS' ? 0 : 1;
        const bLive = b.status === 'STATUS_IN_PROGRESS' ? 0 : 1;
        return aLive - bLive;
      });

      sorted.forEach(game => {
        container.appendChild(renderCard(game));
      });
    }

    // Render all
    async function renderAllGames() {
      await loadAllGames();
      updateFavoritesDisplay();
      updateLiveDisplay();
      Object.keys(leagues).forEach(league => renderLeague(leagues[league].id));
    }

    // Load all games
    async function loadAllGames() {
      allGames.mlb = await fetchMLB();
      allGames.npb = await fetchNPB();
      allGames.kbo = await fetchKBO();
      allGames.lmb = await fetchLMB();
      allGames.aaa = await fetchAAA();
    }

    // Section toggle
    document.querySelectorAll('.section-header').forEach(header => {
      header.addEventListener('click', () => {
        const content = header.nextElementSibling;
        const toggle = header.querySelector('.section-toggle');
        content.classList.toggle('collapsed');
        toggle.classList.toggle('collapsed');
      });
    });

    // Refresh button
    document.getElementById('refreshBtn').addEventListener('click', () => {
      Object.keys(API_CACHE).forEach(k => delete API_CACHE[k]);
      renderAllGames();
    });

    // Init
    async function init() {
      initShapes();
      await renderAllGames();
      
      // Auto-refresh every 45 seconds
      autoRefreshInterval = setInterval(() => {
        const now = Date.now();
        if (now - lastRefresh > 40000) {
          Object.keys(API_CACHE).forEach(k => delete API_CACHE[k]);
          renderAllGames();
          lastRefresh = now;
        }
      }, 10000);
    }

    init();
  </script>
</body>
</html>
